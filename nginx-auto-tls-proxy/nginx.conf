user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Server names are hostnames of up to 253 characters (sites and aliases).
    # The 64-byte default bucket only fits names of up to 46 characters, and
    # nginx refuses to start with a longer one. 512 fits any valid hostname;
    # the hash is built once at startup, so the cost is a few kilobytes.
    server_names_hash_bucket_size 512;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] $host "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    gzip on;

    # WebSocket upgrade map (referenced by proxy server blocks)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Global SSL defaults (inherited by all server blocks)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format stream '$remote_addr [$time_local] $ssl_server_name '
                      '$protocol $status $bytes_sent $bytes_received '
                      '$session_time $upstream_addr';

    access_log /var/log/nginx/stream-access.log stream;

    include /etc/nginx/stream.d/*.conf;
}
